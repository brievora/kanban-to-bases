# Publishes a release when a version tag is pushed (git tag 1.0.1 && git push origin 1.0.1).
# GitHub builds the plugin, runs the tests, attests the three release files and attaches them to the release.
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
      - name: Check that the tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
