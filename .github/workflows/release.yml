# Publishes a release when a version tag is pushed (git tag 1.0.1 && git push origin 1.0.1).
# Two jobs: "build" installs the dependencies, runs the tests and builds the plugin with read-only rights;
# "release" runs no dependency code, it only attests the three files built by "build" and attaches them to the release.
# Actions are pinned to a full commit SHA (the tag in the comment is the version it points to).
name: Release

on:
  push:
    tags: ['*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
      - name: Check that the tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
